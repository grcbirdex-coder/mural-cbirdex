<!DOCTYPE html>
<html lang="pt-BR">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Mural CBirdex</title>

<style>

html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
}

.media {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: contain;
    background: #000;
    opacity: 0;
    transition: opacity 1s ease-in-out;
}

.media.ativo {
    opacity: 1;
}

</style>

</head>

<body>


<!-- ===================================================== -->
<!-- VÍDEO INSTITUCIONAL -->
<!-- ===================================================== -->

<video
    id="video1"
    class="media ativo"
    autoplay
    muted
    playsinline
    preload="auto">

    <source
        src="WhatsApp Video 2026-08-03 at 12.34.00.mp4"
        type="video/mp4">

</video>


<!-- ===================================================== -->
<!-- VÍDEO OUTUBRO ROSA -->
<!-- ATIVO SOMENTE DURANTE OUTUBRO/2026 -->
<!-- ===================================================== -->

<video
    id="videoOutubro"
    class="media"
    muted
    playsinline
    preload="auto">

    <source
        src="Video%20outubro%20rosa%20%281%29.mp4"
        type="video/mp4">

</video>


<!-- ===================================================== -->
<!-- IMAGEM OUTUBRO ROSA -->
<!-- ATIVA SOMENTE DURANTE OUTUBRO/2026 -->
<!-- ===================================================== -->

<img
    id="imagemOutubro"
    class="media"
    src="evento%20outubro%20rosa.jpeg"
    alt="Outubro Rosa CBirdex">


<!-- ===================================================== -->
<!-- TREINAMENTO DE BRIGADA DE INCÊNDIO -->
<!-- ===================================================== -->

<img
    id="imagemBrigada"
    class="media"
    src="treinamento-brigada-incendio.jpeg"
    alt="Treinamento de Brigada de Incêndio">


<!-- ===================================================== -->
<!-- BANNER MOBILIZAÇÃO SEST SENAT -->
<!-- ===================================================== -->

<img
    id="imagem1"
    class="media"
    src="ChatGPT Image 3 de ago. de 2026, 14_44_24.png"
    alt="Mobilização Nacional SEST SENAT">


<script>


/* =====================================================
   CONFIGURAÇÃO
   ===================================================== */

/*
   Tempo de exibição das imagens.
   18000 = 18 segundos
*/

const tempoImagem = 18000;


/* =====================================================
   PERÍODO DO OUTUBRO ROSA
   ===================================================== */

const inicioOutubro =
    new Date("2026-10-01T00:00:00");

const fimOutubro =
    new Date("2026-10-31T23:59:59.999");


/* =====================================================
   ELEMENTOS
   ===================================================== */

const video1 =
    document.getElementById("video1");

const videoOutubro =
    document.getElementById("videoOutubro");

const imagemOutubro =
    document.getElementById("imagemOutubro");

const imagemBrigada =
    document.getElementById("imagemBrigada");

const imagem1 =
    document.getElementById("imagem1");


/* =====================================================
   VERIFICAR OUTUBRO ROSA
   ===================================================== */

function outubroRosaAtivo() {

    const agora = new Date();

    return (
        agora >= inicioOutubro &&
        agora <= fimOutubro
    );

}


/* =====================================================
   ESCONDER TUDO
   ===================================================== */

function esconderTudo() {

    document
        .querySelectorAll(".media")
        .forEach(function(item) {

            item.classList.remove("ativo");

            if (item.tagName === "VIDEO") {

                item.pause();

            }

        });

}


/* =====================================================
   VÍDEO INSTITUCIONAL
   ===================================================== */

function mostrarVideo1() {

    esconderTudo();

    video1.classList.add("ativo");

    video1.currentTime = 0;

    video1.play().catch(function() {});

}


/* =====================================================
   VÍDEO OUTUBRO ROSA
   ===================================================== */

function mostrarVideoOutubro() {

    /*
       Se outubro já terminou,
       pula diretamente para a Brigada.
    */

    if (!outubroRosaAtivo()) {

        mostrarBrigada();

        return;

    }

    esconderTudo();

    videoOutubro.classList.add("ativo");

    videoOutubro.currentTime = 0;

    videoOutubro.play().catch(function() {});

}


/* =====================================================
   IMAGEM OUTUBRO ROSA
   ===================================================== */

function mostrarImagemOutubro() {

    /*
       Se outubro já terminou,
       pula diretamente para a Brigada.
    */

    if (!outubroRosaAtivo()) {

        mostrarBrigada();

        return;

    }

    esconderTudo();

    imagemOutubro.classList.add("ativo");

    setTimeout(function() {

        mostrarBrigada();

    }, tempoImagem);

}


/* =====================================================
   TREINAMENTO DE BRIGADA
   ===================================================== */

function mostrarBrigada() {

    esconderTudo();

    imagemBrigada.classList.add("ativo");

    setTimeout(function() {

        mostrarImagem1();

    }, tempoImagem);

}


/* =====================================================
   MOBILIZAÇÃO SEST SENAT
   ===================================================== */

function mostrarImagem1() {

    esconderTudo();

    imagem1.classList.add("ativo");

    setTimeout(function() {

        mostrarVideo1();

    }, tempoImagem);

}


/* =====================================================
   FINAL DO VÍDEO INSTITUCIONAL
   ===================================================== */

video1.onended = function() {

    /*
       Durante outubro:
       Vídeo institucional
       ↓
       Vídeo Outubro Rosa

       Depois de outubro:
       Vídeo institucional
       ↓
       Brigada
    */

    if (outubroRosaAtivo()) {

        mostrarVideoOutubro();

    } else {

        mostrarBrigada();

    }

};


/* =====================================================
   FINAL DO VÍDEO OUTUBRO ROSA
   ===================================================== */

videoOutubro.onended = function() {

    if (outubroRosaAtivo()) {

        mostrarImagemOutubro();

    } else {

        mostrarBrigada();

    }

};


/* =====================================================
   ERRO NO VÍDEO INSTITUCIONAL
   ===================================================== */

video1.onerror = function() {

    if (outubroRosaAtivo()) {

        mostrarVideoOutubro();

    } else {

        mostrarBrigada();

    }

};


/* =====================================================
   ERRO NO VÍDEO OUTUBRO ROSA
   ===================================================== */

videoOutubro.onerror = function() {

    mostrarImagemOutubro();

};


/* =====================================================
   INICIAR MURAL
   ===================================================== */

mostrarVideo1();


/* =====================================================
   VERIFICAÇÃO AUTOMÁTICA DA DATA
   ===================================================== */

/*
   Verifica a cada 10 segundos.

   Se chegar novembro enquanto o conteúdo
   do Outubro Rosa estiver sendo exibido,
   o mural passa automaticamente para a Brigada.
*/

setInterval(function() {

    if (!outubroRosaAtivo()) {

        if (
            videoOutubro.classList.contains("ativo") ||
            imagemOutubro.classList.contains("ativo")
        ) {

            mostrarBrigada();

        }

    }

}, 10000);


</script>

</body>

</html>
