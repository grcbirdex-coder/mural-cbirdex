<!DOCTYPE html>
<html lang="pt-BR">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Mural CBirdex</title>

<style>

html,body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
}

.media{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    object-fit:contain;
    background:#000;
    opacity:0;
    transition:opacity 1s ease-in-out;
}

.media.ativo{
    opacity:1;
}

</style>

</head>

<body>

<!-- Vídeo institucional -->

<video
id="video1"
class="media ativo"
autoplay
muted
playsinline
preload="auto">

<source
src="WhatsApp Video 2026-08-03 at 12.34.00.mp4"
type="video/mp4">

</video>



<!-- Banner Mobilização -->

<img
id="imagem1"
class="media"
src="ChatGPT Image 3 de ago. de 2026, 14_44_24.png"
alt="">



<!-- Vídeo Vice Campeão -->

<video
id="video2"
class="media"
muted
playsinline
preload="auto">

<source
src="video vice campeao 2026.mp4"
type="video/mp4">

</video>



<!-- Banner Vice Campeão -->

<img
id="imagem2"
class="media"
src="ChatGPT Image 4 de ago. de 2026, 18_19_37.png"
alt="">



<script>

const tempoImagem = 18000;

const video1 = document.getElementById("video1");
const imagem1 = document.getElementById("imagem1");

const video2 = document.getElementById("video2");
const imagem2 = document.getElementById("imagem2");

function esconderTudo(){

    document.querySelectorAll(".media").forEach(function(item){

        item.classList.remove("ativo");

        if(item.tagName==="VIDEO"){
            item.pause();
        }

    });

}

function mostrarVideo1(){

    esconderTudo();

    video1.classList.add("ativo");

    video1.currentTime=0;

    video1.play().catch(function(){});

}

function mostrarImagem1(){

    esconderTudo();

    imagem1.classList.add("ativo");

    setTimeout(mostrarVideo2,tempoImagem);

}

function mostrarVideo2(){

    esconderTudo();

    video2.classList.add("ativo");

    video2.currentTime=0;

    video2.play().catch(function(){});

}

function mostrarImagem2(){

    esconderTudo();

    imagem2.classList.add("ativo");

    setTimeout(mostrarVideo1,tempoImagem);

}

video1.onended = mostrarImagem1;

video2.onended = mostrarImagem2;

video1.onerror = mostrarImagem1;

video2.onerror = mostrarImagem2;

mostrarVideo1();

</script>

</body>

</html>
