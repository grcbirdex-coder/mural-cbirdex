<!DOCTYPE html>
<html lang="pt-BR">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Mural CBirdex</title>

<style>

html,body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
}

.media{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    object-fit:contain;
    background:#000;
    opacity:0;
    transition:opacity 1s ease-in-out;
}

.media.ativo{
    opacity:1;
}

</style>

</head>

<body>


<!-- ===================================================== -->
<!-- VÍDEO 1 - INSTITUCIONAL -->
<!-- ===================================================== -->

<video
id="video1"
class="media ativo"
autoplay
muted
playsinline
preload="auto">

<source
src="WhatsApp Video 2026-08-03 at 12.34.00.mp4"
type="video/mp4">

</video>


<!-- ===================================================== -->
<!-- SETEMBRO AMARELO -->
<!-- Aparece somente de 01/09/2026 00:01 até 30/09/2026 -->
<!-- ===================================================== -->

<img
id="imagemSetembro"
class="media"
src="setembro-amarelo-2026.png"
alt="Setembro Amarelo CBirdex">


<!-- ===================================================== -->
<!-- BANNER MOBILIZAÇÃO SEST SENAT -->
<!-- ===================================================== -->

<img
id="imagem1"
class="media"
src="ChatGPT Image 3 de ago. de 2026, 14_44_24.png"
alt="Mobilização Nacional SEST SENAT">


<!-- ===================================================== -->
<!-- VÍDEO VICE CAMPEÃO -->
<!-- ===================================================== -->

<video
id="video2"
class="media"
muted
playsinline
preload="auto">

<source
src="video vice campeao 2026.mp4"
type="video/mp4">

</video>


<!-- ===================================================== -->
<!-- BANNER VICE CAMPEÃO -->
<!-- ===================================================== -->

<img
id="imagem2"
class="media"
src="ChatGPT Image 4 de ago. de 2026, 18_19_37.png"
alt="CBirdex FC">


<script>


/* =====================================================
   CONFIGURAÇÃO
   ===================================================== */

/*
   Tempo dos banners em milissegundos.

   18000 = 18 segundos
*/

const tempoImagem = 18000;


/* =====================================================
   PERÍODO DO SETEMBRO AMARELO
   ===================================================== */

/*
   INÍCIO:
   01/09/2026 às 00:01

   FIM:
   30/09/2026 às 23:59:59
*/

const inicioSetembro =
    new Date("2026-09-01T00:01:00");

const fimSetembro =
    new Date("2026-09-30T23:59:59.999");


/* =====================================================
   ELEMENTOS
   ===================================================== */

const video1 =
    document.getElementById("video1");

const imagemSetembro =
    document.getElementById("imagemSetembro");

const imagem1 =
    document.getElementById("imagem1");

const video2 =
    document.getElementById("video2");

const imagem2 =
    document.getElementById("imagem2");


/* =====================================================
   VERIFICAR SETEMBRO AMARELO
   ===================================================== */

function setembroAmareloAtivo(){

    const agora = new Date();

    return (
        agora >= inicioSetembro &&
        agora <= fimSetembro
    );

}


/* =====================================================
   ESCONDER TUDO
   ===================================================== */

function esconderTudo(){

    document
        .querySelectorAll(".media")
        .forEach(function(item){

            item.classList.remove("ativo");

            if(item.tagName === "VIDEO"){

                item.pause();

            }

        });

}


/* =====================================================
   VÍDEO 1
   ===================================================== */

function mostrarVideo1(){

    esconderTudo();

    video1.classList.add("ativo");

    video1.currentTime = 0;

    video1.play().catch(function(){});

}


/* =====================================================
   DEPOIS DO VÍDEO 1
   ===================================================== */

/*
   Durante setembro:
   
   Vídeo 1
       ↓
   Setembro Amarelo

   Fora de setembro:

   Vídeo 1
       ↓
   Mobilização
*/

function depoisDoVideo1(){

    if(setembroAmareloAtivo()){

        mostrarSetembro();

    }else{

        mostrarImagem1();

    }

}


/* =====================================================
   SETEMBRO AMARELO
   ===================================================== */

function mostrarSetembro(){

    /*
       Confere a data novamente antes de exibir.
    */

    if(!setembroAmareloAtivo()){

        mostrarImagem1();

        return;

    }

    esconderTudo();

    imagemSetembro.classList.add("ativo");


    /*
       Mostra a campanha por 18 segundos.
    */

    setTimeout(function(){

        mostrarImagem1();

    }, tempoImagem);

}


/* =====================================================
   BANNER MOBILIZAÇÃO
   ===================================================== */

function mostrarImagem1(){

    esconderTudo();

    imagem1.classList.add("ativo");


    /*
       Mostra o banner por 18 segundos.
    */

    setTimeout(function(){

        mostrarVideo2();

    }, tempoImagem);

}


/* =====================================================
   VÍDEO VICE CAMPEÃO
   ===================================================== */

function mostrarVideo2(){

    esconderTudo();

    video2.classList.add("ativo");

    video2.currentTime = 0;

    video2.play().catch(function(){});

}


/* =====================================================
   BANNER VICE CAMPEÃO
   ===================================================== */

function mostrarImagem2(){

    esconderTudo();

    imagem2.classList.add("ativo");


    /*
       Depois do banner, volta para o vídeo 1.
    */

    setTimeout(function(){

        mostrarVideo1();

    }, tempoImagem);

}


/* =====================================================
   EVENTOS DOS VÍDEOS
   ===================================================== */

video1.onended = depoisDoVideo1;

video2.onended = mostrarImagem2;


/* =====================================================
   TRATAMENTO DE ERRO DOS VÍDEOS
   ===================================================== */

video1.onerror = function(){

    depoisDoVideo1();

};

video2.onerror = function(){

    mostrarImagem2();

};


/* =====================================================
   INICIAR MURAL
   ===================================================== */

mostrarVideo1();


/* =====================================================
   VERIFICAÇÃO AUTOMÁTICA
   ===================================================== */

/*
   Se o mural ficar aberto durante a virada do mês,
   verifica a cada 10 segundos se a campanha ainda
   está dentro do período.
*/

setInterval(function(){

    /*
       Se Setembro Amarelo não estiver mais ativo
       e estiver sendo exibido, sai imediatamente.
    */

    if(
        !setembroAmareloAtivo() &&
        imagemSetembro.classList.contains("ativo")
    ){

        mostrarImagem1();

    }

}, 10000);


</script>

</body>

</html>
