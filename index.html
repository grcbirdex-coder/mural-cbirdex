
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mural CBirdex</title>

<style>
html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
}

.media {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: contain;
    background: #000;
    opacity: 0;
    transition: opacity 1s ease-in-out;
}

.media.ativo {
    opacity: 1;
}
</style>
</head>

<body>

<!-- 1. VÍDEO DE ABERTURA -->
<video id="videoEntrada" class="media ativo"
       muted playsinline preload="auto">
    <source src="entrega%20que%20move%20resultados.mp4"
            type="video/mp4">
</video>

<!-- 2. VÍDEO COMERCIAL -->
<video id="videoComercial" class="media"
       muted playsinline preload="auto">
    <source src="video%20comercial.mp4" type="video/mp4">
</video>

<!-- 3. FOTO OUTUBRO ROSA -->
<img id="imagemOutubro" class="media"
     src="evento%20outubro%20rosa.jpeg"
     alt="Outubro Rosa CBirdex">

<!-- 4. TREINAMENTO DA BRIGADA -->
<img id="imagemBrigada" class="media"
     src="treinamento-brigada-incendio.jpeg"
     alt="Treinamento de Brigada de Incêndio">

<!-- 5. MOBILIZAÇÃO SEST SENAT -->
<img id="imagemSestSenat" class="media"
     src="ChatGPT%20Image%203%20de%20ago.%20de%202026,%2014_44_24.png"
     alt="Mobilização Nacional SEST SENAT">

<!-- 6. VÍDEO DA LOGO: FECHAMENTO -->
<video id="videoLogo" class="media"
       muted playsinline preload="auto">
    <source src="video%20logo.mp4" type="video/mp4">
</video>

<script>
/* CONFIGURAÇÃO */
const tempoImagem = 18000;

/* PERÍODO DA CAMPANHA */
const inicioOutubro = new Date("2026-10-01T00:00:00");
const fimOutubro = new Date("2026-10-31T23:59:59.999");

const videoEntrada = document.getElementById("videoEntrada");
const videoComercial = document.getElementById("videoComercial");
const imagemOutubro = document.getElementById("imagemOutubro");
const imagemBrigada = document.getElementById("imagemBrigada");
const imagemSestSenat = document.getElementById("imagemSestSenat");
const videoLogo = document.getElementById("videoLogo");

let temporizador = null;
let etapaAtual = 0;

function outubroRosaAtivo() {
    const agora = new Date();
    return agora >= inicioOutubro && agora <= fimOutubro;
}

function cancelarTemporizador() {
    if (temporizador !== null) {
        clearTimeout(temporizador);
        temporizador = null;
    }
}

function esconderTudo() {
    cancelarTemporizador();

    document.querySelectorAll(".media").forEach(function(item) {
        item.classList.remove("ativo");

        if (item.tagName === "VIDEO") {
            item.pause();
        }
    });
}

function mostrarImagem(imagem, proximaEtapa) {
    esconderTudo();
    etapaAtual = proximaEtapa;
    imagem.classList.add("ativo");

    temporizador = setTimeout(function() {
        avancar();
    }, tempoImagem);
}

function mostrarVideo(video, proximaEtapa) {
    esconderTudo();
    etapaAtual = proximaEtapa;
    video.classList.add("ativo");
    video.currentTime = 0;

    const tentativa = video.play();

    if (tentativa && typeof tentativa.catch === "function") {
        tentativa.catch(function() {
            // Se o navegador bloquear a reprodução, avança
            // para evitar que o mural fique parado.
            if (etapaAtual === proximaEtapa) {
                avancar();
            }
        });
    }
}

function avancar() {
    switch (etapaAtual) {
        case 0:
            mostrarVideo(videoComercial, 1);
            break;

        case 1:
            if (outubroRosaAtivo()) {
                mostrarImagem(imagemOutubro, 2);
            } else {
                mostrarImagem(imagemBrigada, 3);
            }
            break;

        case 2:
            mostrarImagem(imagemBrigada, 3);
            break;

        case 3:
            mostrarImagem(imagemSestSenat, 4);
            break;

        case 4:
            mostrarVideo(videoLogo, 5);
            break;

        case 5:
        default:
            mostrarVideo(videoEntrada, 0);
            break;
    }
}

/* AVANÇO NORMAL DOS VÍDEOS */
[videoEntrada, videoComercial, videoLogo].forEach(function(video) {
    video.addEventListener("ended", function() {
        if (document.visibilityState === "visible") {
            avancar();
        }
    });

    video.addEventListener("error", function() {
        if (video.classList.contains("ativo")) {
            avancar();
        }
    });
});

/* INICIAR O MURAL */
mostrarVideo(videoEntrada, 0);

/* Atualizar a sequência se a campanha entrar ou sair do período. */
setInterval(function() {
    if (!outubroRosaAtivo() && etapaAtual === 2) {
        mostrarImagem(imagemBrigada, 3);
    }
}, 10000);
</script>

</body>
</html>
